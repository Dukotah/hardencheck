<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="HardenCheck">
  <!-- Shield (hardened) with a check + header-line motif. Copper #bf6b3c + ink #14181f, transparent bg. -->
  <!-- Shield body -->
  <path d="M32 4 54 12 V30 C54 44 45 54 32 60 C19 54 10 44 10 30 V12 Z" fill="#bf6b3c"/>
  <!-- Inner ink panel -->
  <path d="M32 10 48 16 V30 C48 41 41.5 49 32 54 C22.5 49 16 41 16 30 V16 Z" fill="#14181f"/>
  <!-- Header "lines" inside the shield -->
  <rect x="23" y="22" width="18" height="3.4" rx="1.7" fill="#faf8f4"/>
  <rect x="23" y="29" width="13" height="3.4" rx="1.7" fill="#7d8893"/>
  <!-- Bold pass checkmark across the lower shield -->
  <path d="M24 37.5 L30 43.5 L42 31.5" fill="none" stroke="#bf6b3c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
